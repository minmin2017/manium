name: Render Manim Videos

on:
  workflow_dispatch:
    inputs:
      scene_file:
        description: "Python file with the Scene class(es), e.g. eps_ch3_parts.py"
        required: true
      scene_names:
        description: "Space or comma separated Scene class names"
        required: true
      quality:
        description: "Manim quality flag letter: l (480p) / m (720p) / h (1080p) / k (4K)"
        required: false
        default: "h"
      fps:
        description: "Frame rate"
        required: false
        default: "25"

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Thai fonts (image already has manim + full LaTeX)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fonts-thai-tlwg
          fc-cache -f

      - name: Render scenes
        env:
          MANIM_THAI_FONT: Loma
        run: |
          set -e
          SCENES="${{ github.event.inputs.scene_names }}"
          SCENES="${SCENES//,/ }"
          manim -q${{ github.event.inputs.quality }} --fps ${{ github.event.inputs.fps }} \
            "${{ github.event.inputs.scene_file }}" $SCENES

      - name: Collect outputs
        run: |
          mkdir -p out
          SCENES="${{ github.event.inputs.scene_names }}"
          SCENES="${SCENES//,/ }"
          for s in $SCENES; do
            find media/videos -name "${s}.mp4" -not -path "*/partial_movie_files/*" -exec cp {} out/ \;
          done
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manim-videos
          path: out/*.mp4
          retention-days: 14
