name: Render Manim Videos

on:
  workflow_dispatch:
    inputs:
      scene_file:
        description: "Python file with the Scene class(es), e.g. eps_ch3_parts.py"
        required: true
      scene_names:
        description: "Space or comma separated Scene class names"
        required: true
      quality:
        description: "Manim quality flag letter: l (480p) / m (720p) / h (1080p) / k (4K)"
        required: false
        default: "h"
      fps:
        description: "Frame rate"
        required: false
        default: "25"

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every workflow_dispatch run starts a brand-new container with an empty media/
      # directory, so manim's own content-hash partial-movie-file cache (see the
      # manim-teaching-video skill sec.13/28) never carries over between runs -- every
      # animation gets re-rendered from scratch even when only one line of a long scene
      # changed. Restoring/saving media/ here lets that existing cache actually persist:
      # unchanged animations (same hash) get skipped, only the edited ones re-render.
      # Split restore+save (not the combined action) so a NEW cache entry is always saved
      # even when an older one was restored -- a single fixed key can only be written once.
      - name: Restore manim render cache
        uses: actions/cache/restore@v4
        with:
          path: media
          key: manim-cache-${{ github.event.inputs.scene_file }}-${{ github.event.inputs.quality }}-${{ github.event.inputs.fps }}-${{ github.run_id }}
          restore-keys: |
            manim-cache-${{ github.event.inputs.scene_file }}-${{ github.event.inputs.quality }}-${{ github.event.inputs.fps }}-

      - name: Thai fonts (image already has manim + full LaTeX)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fonts-thai-tlwg
          fc-cache -f

      - name: Render scenes
        shell: bash
        env:
          MANIM_THAI_FONT: Loma
        run: |
          set -e
          SCENES="${{ github.event.inputs.scene_names }}"
          SCENES="${SCENES//,/ }"
          manim -q${{ github.event.inputs.quality }} --fps ${{ github.event.inputs.fps }} \
            "${{ github.event.inputs.scene_file }}" $SCENES

      - name: Save manim render cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: media
          key: manim-cache-${{ github.event.inputs.scene_file }}-${{ github.event.inputs.quality }}-${{ github.event.inputs.fps }}-${{ github.run_id }}

      - name: Collect outputs
        shell: bash
        run: |
          mkdir -p out
          SCENES="${{ github.event.inputs.scene_names }}"
          SCENES="${SCENES//,/ }"
          for s in $SCENES; do
            find media/videos -name "${s}.mp4" -not -path "*/partial_movie_files/*" -exec cp {} out/ \;
          done
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manim-videos
          path: out/*.mp4
          retention-days: 14
