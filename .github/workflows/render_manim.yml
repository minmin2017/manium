name: Render Manim Videos

on:
  workflow_dispatch:
    inputs:
      scene_file:
        description: "Python file with the Scene class(es), e.g. eps_ch3_parts.py"
        required: true
      scene_names:
        description: "Space or comma separated Scene class names"
        required: true
      quality:
        description: "Manim quality flag letter: l (480p) / m (720p) / h (1080p) / k (4K)"
        required: false
        default: "h"
      fps:
        description: "Frame rate"
        required: false
        default: "25"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System dependencies (ffmpeg, cairo/pango, LaTeX, Thai fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev \
            texlive texlive-latex-extra texlive-fonts-extra texlive-science \
            texlive-xetex tipa cm-super fonts-thai-tlwg
          fc-cache -f

      - name: Install manim
        run: pip install manim==0.20.1

      - name: Render scenes
        env:
          MANIM_THAI_FONT: Loma
        run: |
          set -e
          SCENES="${{ github.event.inputs.scene_names }}"
          SCENES="${SCENES//,/ }"
          manim -q${{ github.event.inputs.quality }} --fps ${{ github.event.inputs.fps }} \
            "${{ github.event.inputs.scene_file }}" $SCENES

      - name: Collect outputs
        run: |
          mkdir -p out
          find media/videos -name "*.mp4" -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manim-videos
          path: out/*.mp4
          retention-days: 14
